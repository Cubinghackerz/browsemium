name: Browsemium
options:
  minimumXcodeGenVersion: 2.41.0
  deploymentTarget:
    macOS: "14.0"
packages:
  BrowsemiumKit:
    path: Packages/BrowsemiumKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.6
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: 14.0
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "200"
    # Xcode's default for app targets. Without it the embedded Sparkle
    # framework cannot be found at launch (dyld: Library not loaded).
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  # Debug builds only the native architecture, like Xcode's own default. Without
  # this a Debug build tries to compile x86_64 as well, and the local package's
  # modules (built for arm64) cannot satisfy it.
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
targets:
  BrowsemiumApp:
    type: application
    platform: macOS
    sources:
      - BrowsemiumApp/App
      - BrowsemiumApp/Assets.xcassets
    # XcodeGen *generates* this file from the properties below, so they are the
    # single source of truth — hand edits here are overwritten on every
    # `xcodegen generate`. SUPublicEDKey is the public key printed by
    # `swift Scripts/release/sparkle-eddsa.swift keygen`; the private key lives
    # at ~/.config/browsemium/sparkle-ed25519.key, outside the repository.
    info:
      path: BrowsemiumApp/Config/Info.plist
      properties:
        # Taken from the build settings so a release script can stamp the real
        # version; a literal here would leave every build reporting 1.0.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Browsemium"
        SUFeedURL: "https://browsemium.vercel.app/appcast.xml"
        SUPublicEDKey: "sM6jmNfL7Bgw/O5t41DS1qdDU0aoUnp6h6312IOyud4="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Advertises Browsemium as a candidate for http/https so it can be
        # chosen as the default browser (and receive external links).
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes:
              - http
              - https
    entitlements:
      path: BrowsemiumApp/Config/Browsemium.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.browsemium.browser
        PRODUCT_NAME: Browsemium
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: BrowsemiumKit
        product: BrowsemiumUI
      # Sparkle powers "Check for Updates…". The feed URL and EdDSA public key
      # live in Info.plist; without real values the updater stays off rather
      # than offering a broken menu item.
      - package: Sparkle
        product: Sparkle
  BrowsemiumCoreTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Packages/BrowsemiumKit/Tests/BrowsemiumCoreTests
    dependencies:
      - package: BrowsemiumKit
        product: BrowsemiumCore
  BrowsemiumEngineTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Packages/BrowsemiumKit/Tests/BrowsemiumEngineTests
    dependencies:
      - package: BrowsemiumKit
        product: BrowsemiumCore
      - package: BrowsemiumKit
        product: BrowsemiumEngine
  BrowsemiumDataTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Packages/BrowsemiumKit/Tests/BrowsemiumDataTests
    dependencies:
      - package: BrowsemiumKit
        product: BrowsemiumCore
      - package: BrowsemiumKit
        product: BrowsemiumData
  BrowsemiumUITests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Packages/BrowsemiumKit/Tests/BrowsemiumUITests
    dependencies:
      - package: BrowsemiumKit
        product: BrowsemiumCore
      - package: BrowsemiumKit
        product: BrowsemiumUI
schemes:
  Browsemium:
    build:
      targets:
        BrowsemiumApp: all
        BrowsemiumCoreTests: [test]
        BrowsemiumEngineTests: [test]
        BrowsemiumDataTests: [test]
        BrowsemiumUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BrowsemiumCoreTests
        - BrowsemiumEngineTests
        - BrowsemiumDataTests
        - BrowsemiumUITests
    archive:
      config: Release
