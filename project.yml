name: Browsemium
options:
  minimumXcodeGenVersion: 2.41.0
  deploymentTarget:
    macOS: "14.0"
packages:
  BrowsemiumKit:
    path: Packages/BrowsemiumKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.6
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ALWAYS_SEARCH_USER_PATHS: NO
    MACOSX_DEPLOYMENT_TARGET: 14.0
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "210"
    # Xcode's default for app targets. Without it the embedded Sparkle
    # framework cannot be found at launch (dyld: Library not loaded).
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  # Debug builds only the native architecture, like Xcode's own default. Without
  # this a Debug build tries to compile x86_64 as well, and the local package's
  # modules (built for arm64) cannot satisfy it.
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
targets:
  # MARK: - Chromium edition
  #
  # The bridge is Objective-C++ on purpose: CEF's C++ API is the supported one,
  # and keeping every C++ file inside this one static library means the Swift
  # side only ever sees the small Objective-C surface in BrowsemiumCEF.h.
  BrowsemiumCEFBridge:
    type: library.static
    platform: macOS
    sources:
      - path: BrowsemiumCEF/Sources
      - path: BrowsemiumCEF/include
        headerVisibility: public
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_ENABLE_CPP_EXCEPTIONS: NO
        GCC_ENABLE_CPP_RTTI: NO
        # The pinned CEF distribution is macosarm64 only. A universal build
        # would produce an Intel slice that cannot load the framework.
        ARCHS: arm64
        # The pinned CEF distribution, reached through the stable `current`
        # symlink that Scripts/fetch-cef.sh maintains.
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendors/CEF/current"
          - "$(SRCROOT)/Vendors/CEF/current/include"
        # No OTHER_LDFLAGS here: a static archive has no link step, so flags on
        # this target would never reach a linker. The CEF wrapper library is
        # linked by the helper and app targets instead.
        # PRODUCT_NAME is explicit because XcodeGen leaves it empty for
        # library.static targets, which produces a product literally named
        # lib.a and a dangling "-l" flag in dependents' link lines.
        PRODUCT_NAME: BrowsemiumCEFBridge
        SKIP_INSTALL: YES

  # One tiny executable, copied into five helper bundles by
  # Scripts/assemble-chromium-bundle.sh.
  BrowsemiumChromiumHelper:
    type: tool
    platform: macOS
    sources:
      - BrowsemiumCEF/Helper
    dependencies:
      - target: BrowsemiumCEFBridge
    settings:
      base:
        PRODUCT_NAME: BrowsemiumChromiumHelper
        ARCHS: arm64
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_ENABLE_CPP_EXCEPTIONS: NO
        GCC_ENABLE_CPP_RTTI: NO
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/BrowsemiumCEF/include"
          - "$(SRCROOT)/Vendors/CEF/current"
          - "$(SRCROOT)/Vendors/CEF/current/include"
        # The bridge's C++ wrapper objects pull in CEF symbols, so every
        # process binary links the wrapper archive and libc++.
        OTHER_LDFLAGS:
          - "$(SRCROOT)/Vendors/CEF/current/build/libcef_dll_wrapper.a"
          - "-lc++"
        SKIP_INSTALL: YES

  BrowsemiumChromium:
    type: application
    platform: macOS
    sources:
      - BrowsemiumChromiumApp
      - Shared/AppShell
      - BrowsemiumApp/App/UpdateController.swift
      - BrowsemiumApp/Assets.xcassets
    info:
      path: BrowsemiumChromiumApp/Config/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleName: Browsemium Chromium
        CFBundleDisplayName: Browsemium Chromium
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Browsemium"
        # Its own feed: the two editions update on their own schedules and the
        # Chromium payload is two orders of magnitude larger.
        SUFeedURL: "https://browsemium.vercel.app/appcast-chromium.xml"
        SUPublicEDKey: "sM6jmNfL7Bgw/O5t41DS1qdDU0aoUnp6h6312IOyud4="
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes:
              - http
              - https
        # Chromium needs to know it may run a JIT and map writable-executable
        # pages in its renderer processes.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: BrowsemiumChromiumApp/Config/BrowsemiumChromium.entitlements
      properties:
        # Deliberately no app sandbox: CEF cannot run sandboxed (the Chromium
        # sandbox needs to spawn its own helpers, which App Sandbox forbids).
        # Chromium's own renderer sandbox is still on; this edition is the
        # power-user build and the landing page says so.
        com.apple.security.network.client: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
        com.apple.security.cs.allow-jit: true
        com.apple.security.cs.allow-unsigned-executable-memory: true
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.browsemium.browser.chromium
        PRODUCT_NAME: Browsemium Chromium
        # The pinned CEF distribution is macosarm64 only.
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        # The bundle layout is assembled and signed by our own scripts, because
        # the five helper bundles are not Xcode targets. See
        # Scripts/assemble-chromium-bundle.sh and sign-chromium.sh.
        CODE_SIGNING_ALLOWED: NO
        # The Objective-C bridge is consumed through module.modulemap inside
        # BrowsemiumCEF/include, so `import BrowsemiumCEF` works in Swift.
        SWIFT_INCLUDE_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/BrowsemiumCEF/include"
        OTHER_LDFLAGS:
          - "$(SRCROOT)/Vendors/CEF/current/build/libcef_dll_wrapper.a"
          - "-lc++"
    dependencies:
      - target: BrowsemiumCEFBridge
      - target: BrowsemiumChromiumHelper
        embed: false
      - package: BrowsemiumKit
        product: BrowsemiumUI
      - package: Sparkle
        product: Sparkle
    postBuildScripts:
      - name: Assemble Chromium bundle
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          "${SRCROOT}/Scripts/assemble-chromium-bundle.sh" \
            "${TARGET_BUILD_DIR}/${WRAPPER_NAME}" \
            "${TARGET_BUILD_DIR}/BrowsemiumChromiumHelper"
          "${SRCROOT}/Scripts/release/sign-chromium.sh" "${TARGET_BUILD_DIR}/${WRAPPER_NAME}" || {
            echo "note: ad-hoc signing failed; the release pipeline signs with a Developer ID" >&2
          }

  BrowsemiumApp:
    type: application
    platform: macOS
    sources:
      - BrowsemiumApp/App
      - Shared/AppShell
      - BrowsemiumApp/Assets.xcassets
    # XcodeGen *generates* this file from the properties below, so they are the
    # single source of truth — hand edits here are overwritten on every
    # `xcodegen generate`. SUPublicEDKey is the public key printed by
    # `swift Scripts/release/sparkle-eddsa.swift keygen`; the private key lives
    # at ~/.config/browsemium/sparkle-ed25519.key, outside the repository.
    info:
      path: BrowsemiumApp/Config/Info.plist
      properties:
        # Taken from the build settings so a release script can stamp the real
        # version; a literal here would leave every build reporting 1.0.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Browsemium"
        SUFeedURL: "https://browsemium.vercel.app/appcast.xml"
        SUPublicEDKey: "sM6jmNfL7Bgw/O5t41DS1qdDU0aoUnp6h6312IOyud4="
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Advertises Browsemium as a candidate for http/https so it can be
        # chosen as the default browser (and receive external links).
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes:
              - http
              - https
    entitlements:
      path: BrowsemiumApp/Config/Browsemium.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.browsemium.browser
        PRODUCT_NAME: Browsemium
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: BrowsemiumKit
        product: BrowsemiumUI
      # Sparkle powers "Check for Updates…". The feed URL and EdDSA public key
      # live in Info.plist; without real values the updater stays off rather
      # than offering a broken menu item.
      - package: Sparkle
        product: Sparkle
  BrowsemiumCoreTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: BrowsemiumCoreTests
        PRODUCT_BUNDLE_IDENTIFIER: com.browsemium.browser.tests.core
    sources:
      - Packages/BrowsemiumKit/Tests/BrowsemiumCoreTests
    dependencies:
      - package: BrowsemiumKit
        product: BrowsemiumCore
  BrowsemiumEngineTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: BrowsemiumEngineTests
        PRODUCT_BUNDLE_IDENTIFIER: com.browsemium.browser.tests.engine
    sources:
      - Packages/BrowsemiumKit/Tests/BrowsemiumEngineTests
    dependencies:
      - package: BrowsemiumKit
        product: BrowsemiumCore
      - package: BrowsemiumKit
        product: BrowsemiumEngine
  BrowsemiumDataTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: BrowsemiumDataTests
        PRODUCT_BUNDLE_IDENTIFIER: com.browsemium.browser.tests.data
    sources:
      - Packages/BrowsemiumKit/Tests/BrowsemiumDataTests
    dependencies:
      - package: BrowsemiumKit
        product: BrowsemiumCore
      - package: BrowsemiumKit
        product: BrowsemiumData
  BrowsemiumUITests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: BrowsemiumUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.browsemium.browser.tests.ui
    sources:
      - Packages/BrowsemiumKit/Tests/BrowsemiumUITests
    dependencies:
      - package: BrowsemiumKit
        product: BrowsemiumCore
      - package: BrowsemiumKit
        product: BrowsemiumEngine
      - package: BrowsemiumKit
        product: BrowsemiumUI
schemes:
  Browsemium:
    build:
      targets:
        BrowsemiumApp: all
        BrowsemiumCoreTests: [test]
        BrowsemiumEngineTests: [test]
        BrowsemiumDataTests: [test]
        BrowsemiumUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BrowsemiumCoreTests
        - BrowsemiumEngineTests
        - BrowsemiumDataTests
        - BrowsemiumUITests
    archive:
      config: Release
  BrowsemiumChromium:
    build:
      targets:
        BrowsemiumChromium: all
        BrowsemiumChromiumHelper: all
        BrowsemiumCEFBridge: all
    run:
      config: Debug
    archive:
      config: Release
