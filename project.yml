name: Browsemium
options:
  minimumXcodeGenVersion: 2.41.0
  deploymentTarget:
    macOS: "14.0"
packages:
  BrowsemiumKit:
    path: Packages/BrowsemiumKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.6
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: 14.0
targets:
  BrowsemiumApp:
    type: application
    platform: macOS
    sources:
      - BrowsemiumApp/App
      - BrowsemiumApp/Assets.xcassets
    info:
      path: BrowsemiumApp/Config/Info.plist
    entitlements:
      path: BrowsemiumApp/Config/Browsemium.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.browsemium.browser
        PRODUCT_NAME: Browsemium
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: BrowsemiumKit
        product: BrowsemiumUI
  BrowsemiumCoreTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Packages/BrowsemiumKit/Tests/BrowsemiumCoreTests
    dependencies:
      - package: BrowsemiumKit
        product: BrowsemiumCore
  BrowsemiumEngineTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Packages/BrowsemiumKit/Tests/BrowsemiumEngineTests
    dependencies:
      - package: BrowsemiumKit
        product: BrowsemiumCore
      - package: BrowsemiumKit
        product: BrowsemiumEngine
  BrowsemiumDataTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Packages/BrowsemiumKit/Tests/BrowsemiumDataTests
    dependencies:
      - package: BrowsemiumKit
        product: BrowsemiumCore
      - package: BrowsemiumKit
        product: BrowsemiumData
  BrowsemiumUITests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Packages/BrowsemiumKit/Tests/BrowsemiumUITests
    dependencies:
      - package: BrowsemiumKit
        product: BrowsemiumCore
      - package: BrowsemiumKit
        product: BrowsemiumUI
schemes:
  Browsemium:
    build:
      targets:
        BrowsemiumApp: all
        BrowsemiumCoreTests: [test]
        BrowsemiumEngineTests: [test]
        BrowsemiumDataTests: [test]
        BrowsemiumUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BrowsemiumCoreTests
        - BrowsemiumEngineTests
        - BrowsemiumDataTests
        - BrowsemiumUITests
    archive:
      config: Release
