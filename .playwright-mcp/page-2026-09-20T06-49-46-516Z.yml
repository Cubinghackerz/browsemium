          - heading "Background tabs get unloaded, and it tells you." [level=2] [ref=e146]
          - paragraph [ref=e147]: Browsemium does not claim to render pages faster than Chrome. It claims to stop wasting memory on tabs you have not looked at in an hour. Idle tabs are unloaded on a schedule you control, with a ceiling on how many stay live.
          - paragraph [ref=e148]: "The trade-off is stated plainly in the app: a tab you return to reloads. WebKit does not report per-tab memory, so Browsemium never shows a number it cannot verify."
