    - generic [ref=e202]:
      - heading "Three ways to install" [level=2] [ref=e203]
      - paragraph [ref=e204]: Browsemium is signed ad-hoc rather than with an Apple Developer ID. That means a browser download is refused once by Gatekeeper, and it says so right here instead of pretending otherwise. The first two paths avoid that entirely.
      - generic [ref=e205]:
        - generic [ref=e206]:
          - generic [ref=e207]: Recommended
          - heading "Terminal installer" [level=3] [ref=e208]
          - paragraph [ref=e209]: Fetches the release with curl, verifies its SHA-256 against this site, installs to Applications. No Gatekeeper prompt, because nothing marks the file as a browser download.
          - generic [ref=e210]: curl -fsSL https://browsemium.vercel.app/install.sh | bash
        - generic [ref=e211]:
          - heading "Homebrew" [level=3] [ref=e212]
          - paragraph [ref=e213]: One command for people who already live in the terminal. The cask is updated by the release workflow on every version.
          - generic [ref=e214]: brew install --cask \ cubinghackerz/tap/browsemium
        - generic [ref=e215]:
          - heading "Download the DMG" [level=3] [ref=e216]
          - paragraph [ref=e217]: Drag Browsemium into Applications, then allow it once under System Settings → Privacy & Security → Open Anyway. The dialog is Apple's missing certificate, not a detection.
          - generic [ref=e218]: xattr -dr com.apple.quarantine \ /Applications/Browsemium.app
