name: Release

# Publishing a release is a tag push: git tag v2.0.0 && git push origin v2.0.0.
# The workflow builds the DMG, signs it for Sparkle, publishes the GitHub
# release, refreshes the appcast and checksum, deploys the site, and updates
# the Homebrew cask. No manual steps.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore the Sparkle signing key
        run: |
          if [ -z "${{ secrets.SPARKLE_ED25519_KEY }}" ]; then
            echo "SPARKLE_ED25519_KEY secret is not set; updates could not be signed." >&2
            exit 1
          fi
          mkdir -p "$HOME/.config/browsemium"
          printf '%s' "${{ secrets.SPARKLE_ED25519_KEY }}" > "$HOME/.config/browsemium/sparkle-ed25519.key"
          chmod 600 "$HOME/.config/browsemium/sparkle-ed25519.key"

      - name: Generate the project
        run: xcodegen generate --spec project.yml

      - name: Build the DMG (with launch and crash-recovery gates)
        run: Scripts/release/build-local-dmg.sh "${{ steps.version.outputs.version }}"

      - name: Sign the DMG for Sparkle
        id: sign
        run: |
          DMG="build/Browsemium-${{ steps.version.outputs.version }}.dmg"
          SIGNATURE="$(swift Scripts/release/sparkle-eddsa.swift sign "$DMG")"
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          SIZE="$(stat -f%z "$DMG")"
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="ReleaseNotes/$VERSION.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="$(mktemp)"
            printf 'Browsemium %s. See the repository for details.\n' "$VERSION" > "$NOTES"
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "build/Browsemium-$VERSION.dmg" --clobber
            gh release edit "v$VERSION" --notes-file "$NOTES"
          else
            gh release create "v$VERSION" "build/Browsemium-$VERSION.dmg" \
              --title "Browsemium $VERSION" \
              --notes-file "$NOTES"
          fi

      - name: Refresh the appcast and checksum
        run: |
          python3 Scripts/release/update-appcast.py \
            --version "${{ steps.version.outputs.version }}" \
            --signature "${{ steps.sign.outputs.signature }}" \
            --size "${{ steps.sign.outputs.size }}" \
            --sha256 "${{ steps.sign.outputs.sha }}"

      - name: Commit the refreshed site files
        run: |
          git config user.name "Browsemium Release"
          git config user.email "releases@browsemium.local"
          git add Site/appcast.xml Site/checksum.txt
          git diff --cached --quiet || git commit -m "Publish ${{ steps.version.outputs.version }} appcast and checksum"
          # The tag checkout leaves HEAD detached, so push explicitly to main.
          git push origin HEAD:main

      - name: Deploy the site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # `secrets` is not allowed in a step `if:` condition, so the check
          # lives here instead.
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set; skipping the site deploy." >&2
            exit 0
          fi
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --cwd Site

      - name: Update the Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN != '' && secrets.TAP_TOKEN || github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sign.outputs.sha }}"
          TAP="Cubinghackerz/homebrew-tap"
          if ! gh repo view "$TAP" >/dev/null 2>&1; then
            echo "Tap repository $TAP does not exist yet; skipping." >&2
            exit 0
          fi
          TMP="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$TAP.git" "$TMP"
          mkdir -p "$TMP/Casks"
          cat > "$TMP/Casks/browsemium.rb" <<EOF
          cask "browsemium" do
            version "$VERSION"
            sha256 "$SHA"

            url "https://github.com/Cubinghackerz/browsemium/releases/download/v#{version}/Browsemium-#{version}.dmg"
            name "Browsemium"
            desc "macOS browser built around AI assistants"
            homepage "https://browsemium.vercel.app"

            app "Browsemium.app"

            caveats <<~EOS
              Browsemium is signed ad-hoc rather than with a Developer ID, so the
              first launch is blocked once. Allow it under System Settings →
              Privacy & Security → Open Anyway, or install with no warning at all:
                curl -fsSL https://browsemium.vercel.app/install.sh | bash
            EOS
          end
          EOF
          cd "$TMP"
          git config user.name "Browsemium Release"
          git config user.email "releases@browsemium.local"
          git add Casks/browsemium.rb
          git diff --cached --quiet || git commit -m "browsemium $VERSION"
          git push
